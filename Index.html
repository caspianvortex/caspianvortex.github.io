<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caspian Vortex Volleyball</title>
<style>
  :root { --main:#0b5ed7; --bg:#f7f9fc; --text:#1b1f27; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { background:var(--main); color:#fff; text-align:center; padding:48px 16px; }
  header h1 { margin:0 0 8px; font-size:2rem; }
  nav { background:#fff; position:sticky; top:0; display:flex; justify-content:center; gap:20px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  nav a { color:var(--main); text-decoration:none; font-weight:600; }
  section { max-width:760px; margin:0 auto; padding:32px 16px; }
  h2 { color:var(--main); }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th,td { padding:10px; border-bottom:1px solid #e3e8ef; text-align:left; }
  th { background:var(--main); color:#fff; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  footer { text-align:center; padding:24px; color:#666; font-size:.85rem; }
</style>
</head>
<body>

<header>
  <h1>🏐 Caspian Vortex</h1>
  <p>Volleyball team &middot; Ontario</p>
</header>

<nav>
  <a href="#roster">Roster</a>
  <a href="#schedule">Schedule</a>
</nav>

<section id="roster">
  <h2>Roster</h2>
  <div class="card">
    <table>
      <tr><th>#</th><th>Player</th><th>Position</th></tr>
      <tr><td>1</td><td>Player Name</td><td>Setter</td></tr>
      <tr><td>2</td><td>Player Name</td><td>Outside Hitter</td></tr>
      <tr><td>3</td><td>Player Name</td><td>Libero</td></tr>
    </table>
  </div>
</section>

<section id="schedule">
  <h2>Schedule</h2>
  <div class="card">
    <table>
      <tr><th>Date</th><th>Opponent</th><th>Location</th></tr>
      <tr><td>Oct 15, 7:00 PM</td><td>Opponent</td><td>Gym name</td></tr>
      <tr><td>Oct 22, 7:00 PM</td><td>Opponent</td><td>Gym name</td></tr>
    </table>
  </div>
</section>

<footer>&copy; 2026 Caspian Vortex</footer>

</body>
</html>
